name: Update DART data and deploy dashboard

on:
  schedule:
    # 00:20 UTC on the 1st = 09:20 Korea Standard Time
    - cron: '20 0 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'docs/index.html'
      - '.github/workflows/**'
      - 'config.json'
      - 'requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch and analyze DART reports
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/update_data.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/data data/processed data/report_index.csv
          git add -A data/raw_reports 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update SK hynix DART financial data"
            git push
          else
            echo 'No data changes to commit.'
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
